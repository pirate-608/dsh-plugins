name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0, 24]
        dsh: [0.0.1-rc.5, 0.1.0-rc.6, 0.1.0-rc.8]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node scripts/select-dsh-version.mjs ${{ matrix.dsh }}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run check
